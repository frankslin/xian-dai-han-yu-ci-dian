    <style>
        :root {
            --bg: #eaf3fc;
            --bg-accent: #dcecfb;
            --paper: rgba(247, 252, 255, 0.92);
            --panel: rgba(50, 95, 140, 0.08);
            --line: rgba(50, 95, 140, 0.16);
            --text: #1f3247;
            --muted: #5f7690;
            --brand: #4f89c5;
            --brand-deep: #346ea8;
            --shadow: 0 22px 54px rgba(34, 78, 120, 0.18);
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 9px;
            --radius-pill: 20px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Noto Serif SC", "Source Han Serif SC", "Songti SC", serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(116, 173, 228, 0.25), transparent 28%),
                radial-gradient(circle at top right, rgba(79, 137, 197, 0.16), transparent 22%),
                linear-gradient(180deg, #f4faff 0%, var(--bg) 50%, #dbeafa 100%);
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.42;
            background-image:
                linear-gradient(rgba(50, 95, 140, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(50, 95, 140, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.75), transparent 92%);
        }

        .app-shell {
            position: relative;
            min-height: 100vh;
            padding: 14px;
        }

        .search-panel {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 25;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.7);
            min-width: 0;
            width: min(286px, calc(100vw - 110px));
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .search-label {
            padding-left: 10px;
            color: var(--muted);
            white-space: nowrap;
            font-size: 0.95rem;
        }

        #searchInput {
            flex: 1;
            min-width: 0;
            border: none;
            background: transparent;
            color: var(--text);
            padding: 10px 4px;
            font-size: 1rem;
            outline: none;
        }

        #searchInput::placeholder {
            color: #89a5c0;
        }

        #searchBtn {
            border: none;
            border-radius: var(--radius-pill);
            padding: 12px 18px;
            background: linear-gradient(135deg, var(--brand) 0%, var(--brand-deep) 100%);
            color: #f4fbff;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 12px 24px rgba(79, 137, 197, 0.26);
            transition: transform 0.18s ease, box-shadow 0.18s ease;
        }

        #searchBtn:hover {
            transform: translateY(-1px);
            box-shadow: 0 16px 30px rgba(79, 137, 197, 0.32);
        }

        .workspace {
            min-height: calc(100vh - 28px);
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
        }

        body.with-sidebar-open .workspace {
            padding-right: 346px;
        }

        .viewer-card,
        .sidebar-card {
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            background: linear-gradient(180deg, rgba(249, 253, 255, 0.9), rgba(235, 245, 254, 0.84));
            box-shadow: var(--shadow);
            backdrop-filter: blur(14px);
        }

        .viewer-card {
            padding: 14px;
            display: grid;
            grid-template-rows: 1fr;
            min-height: 0;
        }

        .viewer-overlay {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            flex-wrap: wrap;
            max-width: calc(100% - 24px);
            z-index: 2;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: var(--radius-pill);
            border: 1px solid rgba(50, 95, 140, 0.14);
            background: rgba(245, 251, 255, 0.88);
            backdrop-filter: blur(8px);
            color: var(--muted);
            font-size: 0.88rem;
        }

        .badge strong {
            color: var(--text);
            font-weight: 600;
        }

        #leftright {
            position: relative;
            min-height: 0;
            border-radius: 16px;
            overflow: hidden;
            background:
                linear-gradient(180deg, rgba(62, 110, 160, 0.09), rgba(62, 110, 160, 0.04)),
                linear-gradient(180deg, #f5faff 0%, #e1eefb 100%);
            border: 1px solid rgba(50, 95, 140, 0.12);
            display: grid;
            place-items: center;
            padding: 10px;
        }

        #mainImage {
            display: block;
            width: auto;
            max-width: 100%;
            max-height: calc(100vh - 110px);
            object-fit: contain;
            border-radius: 6px;
            box-shadow: 0 14px 36px rgba(30, 63, 94, 0.16);
            background: #fff;
        }

        #prevBtn,
        #nextBtn {
            position: absolute;
            top: 0;
            width: 22%;
            min-width: 120px;
            height: 100%;
            cursor: pointer;
            transition: background-color 0.2s ease, opacity 0.2s ease;
            opacity: 0;
        }

        #prevBtn {
            left: 0;
            background: linear-gradient(90deg, rgba(34, 65, 95, 0.12), transparent 72%);
        }

        #nextBtn {
            right: 0;
            background: linear-gradient(270deg, rgba(34, 65, 95, 0.12), transparent 72%);
        }

        #prevBtn:hover,
        #nextBtn:hover {
            opacity: 1;
        }

        #prevBtn:hover::after,
        #nextBtn:hover::after {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: rgba(246, 252, 255, 0.92);
            color: var(--brand-deep);
            font-size: 1.5rem;
            box-shadow: 0 10px 24px rgba(34, 78, 120, 0.2);
        }

        #prevBtn:hover::after {
            content: "‹";
            left: 18px;
        }

        #nextBtn:hover::after {
            content: "›";
            right: 18px;
        }

        .sidebar-card {
            position: fixed;
            top: 14px;
            right: 14px;
            bottom: 14px;
            z-index: 24;
            width: min(330px, calc(100vw - 28px));
            padding: 22px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            transition: transform 0.26s ease;
            overflow: hidden;
        }

        .sidebar-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
            min-height: 0;
            padding-left: 20px;
        }

        .sidebar-card.collapsed {
            transform: translateX(calc(100% - 44px));
        }

        .sidebar-card.collapsed .sidebar-section,
        .sidebar-card.collapsed .sidebar-controls,
        .sidebar-card.collapsed .sidebar-title {
            display: none;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-left: 0;
            padding-left: 44px;
        }

        .sidebar-top h2,
        .sidebar-title {
            margin: 0;
            font-size: 1.05rem;
        }

        .sidebar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .outline-btn {
            border: 1px solid rgba(50, 95, 140, 0.16);
            background: rgba(255, 255, 255, 0.76);
            color: var(--brand-deep);
            border-radius: var(--radius-pill);
            height: 34px;
            padding: 0 12px;
            cursor: pointer;
            font: inherit;
            font-size: 0.9rem;
        }

        .collapse-btn {
            border: 1px solid rgba(50, 95, 140, 0.16);
            background: rgba(255, 255, 255, 0.76);
            color: var(--brand-deep);
            border-radius: var(--radius-pill);
            width: 36px;
            height: 36px;
            cursor: pointer;
            font-size: 1rem;
            position: absolute;
            top: 16px;
            left: 4px;
            box-shadow: 0 8px 18px rgba(34, 78, 120, 0.2);
        }

        .sidebar-card.collapsed .sidebar-top {
            justify-content: flex-end;
            margin-left: 0;
            padding-left: 0;
        }

        .sidebar-card.collapsed .sidebar-top h2 {
            display: none;
        }

        .sidebar-card h2 {
            margin: 0;
            font-size: 1.05rem;
        }

        .sidebar-card p,
        .sidebar-card li {
            margin: 0;
            color: var(--muted);
            line-height: 1.65;
            font-size: 0.95rem;
        }

        .sidebar-card ul {
            margin: 0;
            padding-left: 18px;
        }

        .toc-list {
            display: grid;
            gap: 8px;
            flex: 1;
            min-height: 0;
            overflow-y: auto;
            overflow-x: hidden;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 40;
            padding: 16px;
        }

        .modal.open {
            display: flex;
        }

        .modal-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(22, 46, 72, 0.42);
            backdrop-filter: blur(3px);
        }

        .modal-panel {
            position: relative;
            width: min(560px, 100%);
            max-height: min(78vh, 760px);
            overflow: auto;
            border-radius: 16px;
            border: 1px solid var(--line);
            background: linear-gradient(180deg, rgba(249, 253, 255, 0.98), rgba(233, 244, 254, 0.95));
            box-shadow: var(--shadow);
            padding: 18px 26px 18px 34px;
        }

        .modal-panel h2,
        .modal-panel h3 {
            margin: 0 0 10px;
        }

        .modal-panel h3 {
            margin-top: 14px;
            font-size: 1rem;
        }

        .modal-panel ul {
            margin: 0;
            padding-left: 18px;
            color: var(--muted);
            line-height: 1.65;
        }

        .modal-close {
            position: sticky;
            top: 0;
            margin-left: auto;
            display: block;
            width: 34px;
            height: 34px;
            border: 1px solid rgba(50, 95, 140, 0.16);
            border-radius: var(--radius-pill);
            background: rgba(255, 255, 255, 0.88);
            color: var(--brand-deep);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .toc-item {
            width: 100%;
            text-align: left;
            border: 1px solid rgba(50, 95, 140, 0.14);
            background: rgba(255, 255, 255, 0.66);
            color: var(--text);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            font: inherit;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .toc-item:hover {
            border-color: rgba(79, 137, 197, 0.34);
            background: rgba(241, 248, 255, 0.92);
        }

        .toc-item.active {
            border-color: rgba(79, 137, 197, 0.4);
            background: rgba(98, 157, 214, 0.14);
        }

        .toc-label {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc-page {
            color: var(--muted);
            font-size: 0.88rem;
            white-space: nowrap;
        }

        @media (max-width: 1100px) {
            body {
                overflow: auto;
            }

            body.with-sidebar-open .workspace {
                padding-right: 0;
            }

            .app-shell {
                min-height: auto;
                padding: 12px;
            }

            .search-panel {
                top: 12px;
                left: 12px;
                width: min(260px, calc(100vw - 104px));
            }

            .sidebar-card {
                top: 12px;
                right: 12px;
                bottom: 12px;
            }

            #mainImage {
                max-height: min(76vh, 1100px);
            }
        }

        @media (max-width: 700px) {
            .app-shell {
                padding: 8px;
            }

            body.with-sidebar-open .workspace {
                padding-right: 0;
            }

            .viewer-card,
            .sidebar-card {
                border-radius: 14px;
            }

            .search-panel {
                top: auto;
                bottom: 10px;
                left: 10px;
                display: grid;
                grid-template-columns: 1fr;
                border-radius: 12px;
                padding: 10px;
                width: min(200px, calc(100vw - 20px));
            }

            .search-label {
                padding-left: 0;
                font-size: 0.86rem;
            }

            #searchBtn {
                width: 100%;
            }

            .sidebar-card {
                width: min(300px, calc(100vw - 12px));
                top: 8px;
                right: 8px;
                bottom: 64px;
                border-radius: 12px;
                padding: 14px 12px;
            }

            .sidebar-section {
                padding-left: 16px;
            }

            .workspace {
                min-height: calc(100vh - 16px);
                gap: 8px;
            }

            .viewer-card {
                padding: 8px;
            }

            #leftright {
                padding: 6px;
                min-height: 0;
            }

            .viewer-overlay {
                top: 8px;
                right: 8px;
                max-width: calc(100% - 16px);
            }

            .badge {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            #mainImage {
                width: 100%;
                max-width: 100%;
                max-height: calc(100vh - 170px);
                object-fit: contain;
            }

            .sidebar-card.collapsed {
                transform: translateX(calc(100% - 40px));
            }

            .collapse-btn {
                top: 12px;
                left: 2px;
            }

            .toc-list {
                min-height: 120px;
            }

            .sidebar-card p,
            .sidebar-card li {
                font-size: 0.88rem;
                line-height: 1.5;
            }

            .modal-panel {
                border-radius: 12px;
                padding: 12px 16px 12px 20px;
            }

        }
    </style>
</head>

<body>
    <div class="app-shell">
        <div class="search-panel" id="searchContainer">
            <label class="search-label" for="searchInput">拼音 / 页码</label>
            <input type="text" id="searchInput" placeholder="miao、1">
            <button id="searchBtn" onclick="searchImage()">跳转页面</button>
        </div>

        <main class="workspace">
            <section class="viewer-card">
                <div id="leftright" tabindex="-1">
                    <div class="viewer-overlay">
                        <span class="badge"><strong id="pageLabel">扉页</strong></span>
                        <span class="badge" id="pageProgress">5 / 1897</span>
                    </div>
                    <img id="mainImage" src="images/0005.jpg" alt="现代汉语词典页面">
                    <div id="prevBtn" onclick="changeImage(-1)" aria-label="上一页" title="上一页"></div>
                    <div id="nextBtn" onclick="changeImage(1)" aria-label="下一页" title="下一页"></div>
                </div>
            </section>

            <aside class="sidebar-card">
                <button class="collapse-btn" id="sidebarToggleBtn" type="button" aria-label="收起侧边栏" title="收起侧边栏">›</button>
                <div class="sidebar-top">
                    <h2 class="sidebar-title">目录</h2>
                    <div class="sidebar-controls">
                        <button class="outline-btn" id="helpOpenBtn" type="button">说明</button>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="toc-list" id="tocList"></div>
                </div>
            </aside>
        </main>
    </div>

    <div class="modal" id="helpModal" aria-hidden="true">

            searchInputEl.addEventListener('compositionend', function() {
                isComposingInput = false;
            });
            searchInputEl.addEventListener('keydown', function(e) {
                if (e.key !== 'Enter') return;
                if (e.isComposing || isComposingInput || e.keyCode === 229) return;
                searchImage();
            });
        }

        if (searchContainerEl && searchInputEl) {
            searchContainerEl.addEventListener('click', function(e) {
                if (e.target && e.target.id === 'searchBtn') return;
                if (e.target === searchInputEl) return;
                searchInputEl.focus();
                searchInputEl.select();
            });
        }

        document.addEventListener('keydown', function(e) {
            if (helpModalEl && helpModalEl.classList.contains('open')) {
                if (e.key === 'Escape') {
                    e.preventDefault();
                    closeHelpModal();
                }
                return;
            }
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                changeImage(-1);
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                changeImage(1);
            }
        });

        document.addEventListener('wheel', function(e) {
            if (helpModalEl && helpModalEl.classList.contains('open')) return;
            if (e.deltaX === 0 || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
            const now = Date.now();
            if (now - lastWheelTime < wheelCooldownMs) {
                accumulatedWheelDeltaX = 0;
                return;
            }

            if (wheelResetTimer) clearTimeout(wheelResetTimer);
            wheelResetTimer = setTimeout(function() {
                accumulatedWheelDeltaX = 0;
            }, wheelResetMs);

            accumulatedWheelDeltaX += e.deltaX;
            if (Math.abs(accumulatedWheelDeltaX) < wheelThreshold) return;
            e.preventDefault();
            if (accumulatedWheelDeltaX > 0) {
                changeImage(1);
            } else {
                changeImage(-1);
            }
            lastWheelTime = now;
            accumulatedWheelDeltaX = 0;
        }, { passive: false });

        function searchImage() {
            const searchInput = document.getElementById('searchInput').value.trim();
            const numericPage = getImageIndexFromNumericInput(searchInput);
            const pageNumber = numericPage !== null ? numericPage : getPageNumberByName(searchInput);
            if (pageNumber !== null) {
                currentImageIndex = pageNumber;
                showImage();
                focusViewer();
            } else {
                searchInputEl.focus();
                searchInputEl.select();
            }
        }

        function focusViewer() {
            if (!viewerEl) return;
            viewerEl.focus({ preventScroll: true });
        }

        function getImageIndexFromNumericInput(value) {
            if (!/^\d+$/.test(value)) return null;
            const logicalPage = Number(value);
            if (!Number.isInteger(logicalPage) || logicalPage < 1) return null;
            const imageIndex = logicalPage + 94;
            if (imageIndex > totalImages) return null;
            return imageIndex;
        }

        function getPageNumberByName(name) {
            const normalizedName = name.trim().toLowerCase();
            const result = SEARCH_BOOKMARKS.find(function(item) {
                return item.name === name || item.name.toLowerCase() === normalizedName;
            });
            return result ? result.page : null;
        }

        function getPageLabel(index) {
            let closestLabel = "正文";
            let closestPage = 0;
            for (const bookmark of BOOKMARKS) {
                if (bookmark.page <= index && bookmark.page >= closestPage) {
                    closestPage = bookmark.page;
                    closestLabel = bookmark.name;
                }
            }
            return closestLabel;
        }

        function renderToc() {
            tocListEl.innerHTML = '';
            const currentLabel = getPageLabel(currentImageIndex);
            for (const bookmark of BOOKMARKS) {
                const button = document.createElement('button');
                button.type = 'button';
                button.className = 'toc-item' + (bookmark.name === currentLabel ? ' active' : '');
                button.innerHTML = '<span class="toc-label">' + bookmark.name + '</span><span class="toc-page">' + formatShortPage(bookmark.page) + '</span>';
                button.addEventListener('click', function() {
                    currentImageIndex = bookmark.page;
                    showImage();
                });
                tocListEl.appendChild(button);
            }
        }

        function toggleSidebar() {
            const collapsed = sidebarEl.classList.toggle('collapsed');
            document.body.classList.toggle('with-sidebar-open', !collapsed);
            sidebarToggleBtn.textContent = collapsed ? '‹' : '›';
            sidebarToggleBtn.setAttribute('aria-label', collapsed ? '展开侧边栏' : '收起侧边栏');
            sidebarToggleBtn.title = collapsed ? '展开侧边栏' : '收起侧边栏';
        }

        function openHelpModal() {
            helpModalEl.classList.add('open');
            helpModalEl.setAttribute('aria-hidden', 'false');
            if (helpCloseBtnEl) helpCloseBtnEl.focus();
        }

        function closeHelpModal() {
            helpModalEl.classList.remove('open');
            helpModalEl.setAttribute('aria-hidden', 'true');
            if (helpOpenBtnEl) helpOpenBtnEl.focus();
        }

        function getImageBucket() {
            const width = window.innerWidth;
            if (width <= 600) return "400w";
            if (width <= 1200) return "800w";
            return "1600w";
        }

        function getLogicalPageNumber(index) {
            return index - 94;
        }

        function formatDisplayPage(index) {
            if (index >= 95) {
                return '正文第 ' + getLogicalPageNumber(index) + ' 页';
            }
            return '前置第 ' + index + ' 页';
        }

        function formatShortPage(index) {
            if (index >= 95) {
                return '第 ' + getLogicalPageNumber(index) + ' 页';
            }
            return '前置 ' + index;
        }

        function getImagePath(index) {
            const imageName = pad(index, 4) + '.jpg';
            return new URL('images/' + imageName, assetBaseUrl).href;
        }
        
        function preloadImage(src) {
            const img = new Image();
            img.src = src;
        }
        function preloadAround(index) {
            preloadImage(getImagePath(index + 1));
            preloadImage(getImagePath(index - 1));
        }

        function updateUIState() {
            const pageLabel = getPageLabel(currentImageIndex);
            pageLabelEl.textContent = pageLabel;
            pageProgressEl.textContent = formatDisplayPage(currentImageIndex);
            renderToc();
        }

        function showImage() {
            const src = getImagePath(currentImageIndex);
            preloadImage(src);
            mainImage.src = src;
            mainImage.alt = '现代汉语词典第 ' + currentImageIndex + ' 页';
            preloadAround(currentImageIndex);
            updateUIState();
        }

        function changeImage(offset) {
            currentImageIndex += offset;
            if (currentImageIndex < 1) {
                currentImageIndex = 1;
            } else if (currentImageIndex > totalImages) {
                currentImageIndex = totalImages;
            }
            showImage();
        }

        function pad(num, size) {
            num = num.toString();
            while (num.length < size) num = "0" + num;
            return num;
        }

        function showButtons() {
            document.getElementById('prevBtn').style.display = 'block';
            document.getElementById('nextBtn').style.display = 'block';
        }

        function hideButtons() {
            document.getElementById('prevBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        mainImage.addEventListener('mouseenter', showButtons);
        mainImage.addEventListener('mouseleave', hideButtons);

        document.getElementById('prevBtn').addEventListener('mouseenter', showButtons);
        document.getElementById('prevBtn').addEventListener('mouseleave', hideButtons);

        document.getElementById('nextBtn').addEventListener('mouseenter', showButtons);
        document.getElementById('nextBtn').addEventListener('mouseleave', hideButtons);
        document.body.classList.add('with-sidebar-open');
        sidebarToggleBtn.addEventListener('click', toggleSidebar);
        helpOpenBtnEl.addEventListener('click', openHelpModal);
        helpCloseBtnEl.addEventListener('click', closeHelpModal);
        helpBackdropEl.addEventListener('click', closeHelpModal);

        window.addEventListener('resize', function() {
            showImage();
        });

        showImage();
    </script>
</body>

</html>
